[package]
name = "coqui-aos"
version = "0.0.0-alpha.0"
description = "The Agent Overlay Specification (AOS) in Rust: reading overlays, validating manifests, tree digests, composition and the environment an overlay builds, through a filesystem trait the caller supplies"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-aos"
homepage = "https://boriken-dev.github.io/coqui-aos/"
keywords = ["aos", "agent", "overlay", "manifest", "configuration"]
categories = ["config", "parser-implementations"]
# The tests read the specification's vectors from the repository's `vectors/`, outside the package.
exclude = [".*", "*.local.*", "/tests/"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `std::fs` as a `FileSystem`. The core itself reads nothing: a build for wasm32-unknown-unknown turns this off.
default = ["fs"]
fs = []
# `coqui_aos::vectors`: the specification's conformance vectors as a runner a consumer calls from its own tests.
test-support = ["dep:base64"]
# `Serialize` and `Deserialize` for `SetupRecord` and `Phase`.
serde = ["dep:serde"]
# `coqui_aos::index`: an index of an overlay's knowledge on disk (passages, BM25, vectors, generations written
# beside the committed one) and its `SearchBackend`. It reads and writes files.
index = ["dep:serde", "dep:globset", "dep:data-encoding"]
# `coqui_aos::index::HttpEmbedder`: an OpenAI-compatible embeddings endpoint over HTTP.
embeddings = ["index", "dep:ureq"]

[dependencies]
# The settings types describe themselves once, through these derives.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "75f9ef4a302e28caa16b2231cc11b4c2b9a53c9d", default-features = false, features = ["derive"] }
# AOS refuses a YAML tag, anchor, alias, merge key and directive, which only the parser's events show;
# this is the parser `serde-saphyr` is built on.
granit-parser = { version = "2", default-features = false, features = ["std"] }
# Order is kept: a document is read in the order it was written, and a refusal names the later of two
# equal keys. `preserve_order` is global to a build that holds serde_json.
serde_json = { version = "1", features = ["preserve_order"] }
# Reading the vectors' base64, for `test-support`.
base64 = { version = "0.22", optional = true }
# `Serialize` and `Deserialize`, for `serde`.
serde = { version = "1", default-features = false, features = ["alloc", "derive"], optional = true }
sha2 = { version = "0.10", default-features = false }
# The template engines of a knowledge file: envsubst and Mustache as their own specifications define them.
tplx-rs = { git = "https://github.com/jose-pr/tplx-rs", rev = "0298ec416a1676d088abf4f8519812ec4b5eb1e1", default-features = false }
# The index's include and exclude filters.
globset = { version = "0.4", default-features = false, optional = true }
# The index stores vectors as base64.
data-encoding = { version = "2", default-features = false, features = ["std"], optional = true }
# The embeddings client, with the platform's certificate verifier.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"], optional = true }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "preserve_order"] }
# A refusal's subject escapes the characters of the general categories the specification names.
unicode-general-category = "1"

[dev-dependencies]
# This crate's own tests run the vectors through `coqui_aos::vectors`.
coqui-aos = { path = ".", default-features = false, features = ["test-support", "serde"] }
# Directories the tree tests write.
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

# Reads real directories through `StdFs`.
[[test]]
name = "tree"
required-features = ["fs"]

# Reads and writes an index in a directory.
[[test]]
name = "knowledge_index"
required-features = ["index"]
