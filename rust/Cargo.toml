[package]
name = "coqui-aos"
version = "0.0.0-alpha.0"
description = "The Agent Overlay Specification (AOS) in Rust: reading overlays, validating manifests, tree digests, composition and the environment an overlay builds, through a filesystem trait the caller supplies"
readme = "README.md"
edition = "2024"
rust-version = "1.89"
license = "MPL-2.0"
repository = "https://github.com/Boriken-Dev/coqui-aos"
homepage = "https://boriken-dev.github.io/coqui-aos/"
keywords = ["aos", "agent", "overlay", "manifest", "configuration"]
categories = ["config", "parser-implementations"]
# The tests read the specification's vectors from the repository's `vectors/`, outside the package.
exclude = [".*", "*.local.*", "/tests/"]
# Nothing is published until the owner chooses a release.
publish = false

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[features]
# `std::fs` as a `FileSystem`. The core itself reads nothing: a build for wasm32-unknown-unknown turns this off.
default = ["fs"]
fs = []
# `coqui_aos::vectors`: the specification's conformance vectors as a runner a consumer calls from its own tests.
test-support = ["dep:base64"]

[dependencies]
# The settings types describe themselves once, through these derives.
guatiao = { git = "https://github.com/Boriken-Dev/guatiao", rev = "e0136dcc9760ddd6dd8dc89fc4d41320eec6306e", default-features = false, features = ["derive"] }
# AOS refuses a YAML tag, anchor, alias, merge key and directive, which only the parser's events show;
# this is the parser `serde-saphyr` is built on.
granit-parser = { version = "2", default-features = false, features = ["std"] }
# Order is kept: a document is read in the order it was written, and a refusal names the later of two
# equal keys. `preserve_order` is global to a build that holds serde_json.
serde_json = { version = "1", features = ["preserve_order"] }
# Reading the vectors' base64, for `test-support`.
base64 = { version = "0.22", optional = true }
sha2 = { version = "0.10", default-features = false }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde", "preserve_order"] }
# A refusal's subject escapes the characters of the general categories the specification names.
unicode-general-category = "1"

[dev-dependencies]
# This crate's own tests run the vectors through `coqui_aos::vectors`.
coqui-aos = { path = ".", default-features = false, features = ["test-support"] }
# Directories the tree tests write.
tempfile = "3"

[lints.rust]
missing_docs = "warn"
missing_debug_implementations = "warn"
unsafe_code = "forbid"

# Reads real directories through `StdFs`.
[[test]]
name = "tree"
required-features = ["fs"]
